server {
    listen 80;
    server_name _;
    # Docker service IPs change when a container is recreated. Resolve them at
    # request time so Nginx does not keep forwarding to a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        set $api_backend api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /mcp {
        set $mcp_backend mcp:8001;
        proxy_pass http://$mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host mcp:8001;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/(?:index\.html|app\.js|styles\.css|studio\.html|studio\.js|studio\.css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
