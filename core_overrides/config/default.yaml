  - supplier
  - ship_to
  - bill_to
  - sold_to
  - deliver_to
  - invoice_to
  - payer
  - end_customer
  - consignee
  - ship_from
  include_evidence: true
  include_contact_context: true
  include_role_confidence: true
  include_address_confidence: true
  review_ambiguous_roles: true
  ambiguous_role_margin: 0.08
  infer_country_from_postal_pattern: true
  component_level_confidence: true
  require_structural_validation: true
  typed_components:
    - building
    - building_number
    - residence
    - entrance
    - floor
    - unit
    - house_number
    - house_number_suffix
    - street_type
    - street_name
    - lieu_dit
    - industrial_zone
    - business_park
    - address_complement
    - po_box
    - tsa
    - cs
    - postal_routing_code
    - postal_code
    - city
    - cedex
    - cedex_number
    - district
    - insee_code
    - state
    - region
    - country
    - country_code
