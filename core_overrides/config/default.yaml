  manual_review_threshold: 0.82
  review_on_financial_mismatch: true
  financial_mismatch_confidence_cap: 0.74
  semantic_type_conflict_penalty: 0.12
  suspicious_total_penalty: 0.14
  line_parser_disagreement_penalty: 0.07
  reward_arithmetic_consensus: 0.06
  reward_geometry_consensus: 0.04
  review_on_semantic_type_conflict: true
  review_on_suspicious_totals: true
  suspicious_total_confidence_cap: 0.7
  review_on_semantic_hard_guard: true
  semantic_hard_guard_confidence_cap: 0.68
  critical_party_roles:
  - buyer
  - supplier
  invalid_po_number_penalty: 0.25
  invalid_party_role_penalty: 0.12
  missing_explicit_table_field_penalty: 0.16
