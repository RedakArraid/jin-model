engine:
  name: universal_document_ai_rl
  version: 5.1.0
  default_backend: local
  keep_raw_text: true
  keep_page_words: true
  keep_ocr_diagnostics: true
  keep_image_quality_metrics: true
  fail_on_unsupported_file: true
  deterministic: true
  random_seed: 7
input:
  accepted_extensions:
  - pdf
  - png
  - jpg
  - jpeg
  - tif
  - tiff
  - bmp
  - webp
  max_file_size_mb: 100
  max_pages: 250
  reject_empty_files: true
  reject_zero_dimension_images: true
pdf:
  native_text_min_words: 12
  native_text_min_chars: 40
  native_text_min_coverage: 0.0005
  native_text_min_confidence: 0.85
  prefer_native_text: true
  mixed_mode: true
  render_dpi: 300
  retry_render_dpi: 400
  high_quality_render_dpi: 450
  max_render_pixels: 30000000
  password: null
preprocessing:
  enabled: true
  auto_rotate: true
  orientation_detection: true
  orientation_min_confidence: 5.0
  deskew: true
  max_skew_angle: 15.0
  min_skew_angle: 0.15
  dewarp: false
  perspective_correction: false
  crop_border: false
  border_px: 0
  auto_crop_whitespace: true
  whitespace_threshold: 248
  whitespace_crop_padding_px: 18
  min_crop_content_ratio: 0.15
  upscale_small_images: true
  min_width_px: 1400
  min_height_px: 900
  upscale_factor: 2.0
  max_upscale_factor: 3.5
  max_side_px: 5000
  resize_interpolation: cubic
  grayscale: true
  invert_if_dark_background: true
  dark_background_mean_threshold: 100
  contrast_stretch: true
  contrast_low_percentile: 1.0
  contrast_high_percentile: 99.0
  auto_gamma: true
  gamma_target_mean: 190
  gamma_min: 0.65
  gamma_max: 1.55
  background_normalization: false
  background_blur_kernel: 51
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  denoise: true
  denoise_method: nlmeans
  denoise_strength: 10
  nlmeans_template_window: 7
  nlmeans_search_window: 21
  bilateral_filter: false
  bilateral_diameter: 7
  bilateral_sigma_color: 45
  bilateral_sigma_space: 45
  median_blur: false
  median_blur_ksize: 3
  sharpen: true
  sharpen_method: unsharp
  unsharp_sigma: 1.0
  unsharp_amount: 1.5
  unsharp_threshold: 0
  morphology_open: false
  morphology_open_kernel: 2
  morphology_open_iterations: 1
  morphology_close: false
  morphology_close_kernel: 2
  morphology_close_iterations: 1
  threshold_mode: none
  adaptive_thresholding: false
  adaptive_method: gaussian
  adaptive_block_size: 31
  adaptive_c: 15
  binarization: false
  otsu_blur_ksize: 0
  remove_horizontal_lines: false
  remove_vertical_lines: false
  line_kernel_scale: 40
  line_inpaint_radius: 2
ocr:
  engine: tesseract
  languages:
  - fra
  - eng
  - deu
  - spa
  - ita
  fallback_languages:
  - eng
  language_order_matters: false
  auto_language_selection: false
  auto_language_preview_psm: 11
  auto_language_candidates:
  - eng
  - fra
  - deu
  - spa
  - ita
  auto_language_min_words: 8
  psm: 6
  oem: 3
  preserve_interword_spaces: true
  user_defined_dpi: 300
  tessedit_do_invert: true
  load_system_dawg: true
  load_freq_dawg: true
  char_whitelist: null
  char_blacklist: null
  timeout_seconds: 120
  single_pass_timeout_seconds: 35
  page_time_budget_seconds: 90
  min_word_confidence: 20
  drop_negative_confidence: true
  min_token_length: 1
  max_token_length: 120
  filter_garbage_tokens: true
  max_non_alnum_ratio: 0.85
  text_confidence_threshold: 0.5
  field_confidence_threshold: 0.8
  auto_accept_threshold: 0.97
  manual_review_threshold: 0.8
  ensemble_enabled: true
  ensemble_trigger_confidence: 0.9
  ensemble_trigger_min_words: 25
  ensemble_trigger_min_quality: 0.72
  psm_candidates:
  - 3
  - 4
  - 6
  - 11
  - 12
  max_ensemble_passes: 5
  ensemble_merge_words: true
  ensemble_consensus_bonus: 0.08
  ensemble_disagreement_penalty: 0.05
  multiscale_enabled: true
  multiscale_trigger_quality: 0.66
  scale_candidates:
  - 1.0
  - 1.35
  - 1.7
  max_multiscale_passes: 3
  quality_weight_confidence: 0.42
  quality_weight_coverage: 0.2
  quality_weight_alnum: 0.12
  quality_weight_line_structure: 0.1
  quality_weight_numeric: 0.06
  quality_weight_consensus: 0.1
  quality_word_cap: 120
  quality_min_unique_token_ratio: 0.2
layout:
  vector_compartmentalization: true
  vector_min_horizontal_length: 24.0
  vector_min_vertical_length: 18.0
  vector_min_rectangle_width: 24.0
  vector_min_rectangle_height: 12.0
  visual_row_gap_threshold: 48.0
  vat_identifier_extraction: true
  line_y_tolerance_factor: 0.65
  adaptive_line_y_tolerance: true
  line_y_tolerance_min: 0.45
  line_y_tolerance_max: 0.95
  min_table_header_matches: 3
  table_row_gap_factor: 2.5
  table_min_rows: 2
  table_min_columns: 2
  table_min_cell_confidence: 0.4
  table_header_similarity_threshold: 0.68
  column_cluster_tolerance_factor: 0.7
  merge_wrapped_rows: true
  wrapped_row_max_gap_factor: 1.5
  detect_tables: true
  detect_key_value_pairs: true
  key_value_max_horizontal_gap_factor: 9.0
  key_value_max_vertical_gap_factor: 1.3
  key_value_neighbor_window: 3
  detect_checkboxes: true
  detect_stamps: true
  detect_signatures: true
  detect_barcodes: true
  detect_qr_codes: true
  preserve_unknown_tables: true
  preserve_unknown_key_values: true
  spatial_header_recovery: true
  spatial_party_segmentation: true
  multiline_item_segmentation: true
  multiline_anchor_max_x_ratio: 0.24
  infer_line_amount_from_quantity_price: true
  spatial_totals_recovery: true
  document_language_hints: true
  aggregate_native_line_tables_across_pages: true
  packed_native_table_parser: true
  packed_native_table_min_items: 2
  packed_native_table_require_amount_column: true
  continuation_marker_filter: true
  continuation_marker_patterns:
  - ^suite\s+page\s+\d+$
  - ^page\s+\d+\s*(?:/\s*\d+)?$
  - ^continued(?:\s+on)?\s+page\s+\d+$
  header_multiblock_order_number: true
  header_order_number_left_region_max_x_ratio: 0.48
  header_order_number_max_row_gap_ratio: 0.055
  header_order_number_max_tokens: 8
  page_header_repetition_detection: true
  party_zone_segmentation_v2: true
  buyer_corporate_zone_max_y_ratio: 0.16
  supplier_zone_min_x_ratio: 0.48
  supplier_zone_max_y_ratio: 0.34
  prefer_native_amount_over_computed: true
  native_line_deduplication: true
  parse_line_level_charges: true
  preserve_charge_parent_link: true
  native_decimal_max_scale: 6
  labeled_address_table_priority: true
  commercial_metadata_table_priority: true
  environmental_fee_markers:
  - DEEE
  - WEEE
  - ECO-PARTICIPATION
  - ECO PARTICIPATION
  geometry_table_recovery: true
  geometry_table_header_min_terms: 4
  geometry_table_header_terms:
  - reference
  - article
  - designation
  - description
  - quantite
  - qte
  - pu
  - prix
  - montant
  geometry_table_max_header_y_ratio: 0.68
  geometry_table_stop_terms:
  - total ht
  - total net
  - total ttc
  - conditions generales
  - signature
  geometry_table_numeric_anchor_tolerance_ratio: 0.075
  geometry_table_description_continuation_gap_ratio: 0.022
  geometry_table_min_material_digits: 5
  geometry_table_max_material_chars: 30
  geometry_table_min_row_confidence: 0.88
  geometry_table_prefer_printed_amount: true
  geometry_table_validate_quantity_price: true
  geometry_table_amount_tolerance_abs: 0.04
  geometry_table_amount_tolerance_rel: 0.006
  geometry_table_fee_parent_strategy: previous_product
  geometry_table_secondary_reference_headers:
  - adressage
  - code client
  - reference client
  - ref client
  - supplier reference
  inline_transaction_header_recovery: true
  inline_order_labels:
  - commande
  - commande fournisseur
  - bon de commande
  - cde
  - purchase order
  inline_order_number_max_chars: 48
  inline_order_number_min_digits: 3
  inline_order_number_allow_spaces: true
  inline_order_number_normalize_digit_groups: true
  inline_order_number_keep_alpha_groups: true
  inline_order_date_context_tokens:
  - au
  - du
  - le
  - date
  - date commande
  inline_order_site_suffix_separators:
  - /
  - '-'
  inline_order_site_suffix_max_chars: 30
  paired_label_zone_recovery: true
  paired_label_max_vertical_gap_ratio: 0.11
  paired_label_column_split_ratio: 0.5
  ship_to_labels:
  - adresse de livraison
  - lieu de livraison
  - livraison
  - ship to
  - delivery address
  attention_labels:
  - a l'attention de
  - à l'attention de
  - attention
  - attn
  supplier_labels:
  - fournisseur
  - adresse fournisseur
  - vendor
  - supplier
  buyer_labels:
  - acheteur
  - donneur d'ordre
  - ordering party
  - buyer
  infer_buyer_from_ship_to_root: true
  infer_buyer_from_ship_to_min_name_chars: 5
  summary_type_guards: true
  monetary_total_labels:
  - total ht
  - total h.t
  - total net ht
  - total ttc
  - net a payer
  - net à payer
  - montant ht
  non_monetary_summary_labels:
  - total poids
  - poids total
  - total volume
  - volume total
  - total conditionnement
  - conditionnement
  shipping_amount_labels:
  - frais de port
  - port ht
  - transport
  - shipping
  - freight
  suspicious_total_ratio_cap: 20.0
  reset_unlabeled_grand_totals: true
  reset_unlabeled_shipping_totals: true
  preserve_non_monetary_summaries_as_notes: true
  strict_po_number_resolution: true
  learned_shape_min_family_confidence: 0.95
  learned_shape_penalty_min_family_confidence: 0.98
  learned_shape_match_bonus: 0.85
  learned_shape_mismatch_penalty: 0.10
  strict_label_row_y_factor: 0.5
  strict_label_value_max_gap_ratio: 0.075
  strict_label_value_x_tolerance_ratio: 0.12
  strict_po_number_reject_phone_punctuation: true
  strict_po_number_reject_supplier_code_labels: true
  strict_po_number_reject_tax_ids: true
  strict_po_number_explicit_label_bonus: 2.5
  strict_po_trusted_existing_min_confidence: 0.965
  strict_po_trusted_existing_methods:
  - native_table_anchor
  - multiblock_order_number
  - explicit_order_label
  - explicit_n_de_commande
  - inline_transaction_header
  - spatial_order_number
  strict_po_reject_client_account_labels: true
  strict_po_preserve_multitoken_prefixes: true
  native_party_block_recovery: true
  native_party_block_min_lines: 3
  native_party_require_address_or_contact: true
  native_party_priority_over_heuristic: true
  column_labeled_party_recovery: true
  column_party_max_vertical_span_ratio: 0.18
  column_party_address_label_priority: true
  infer_buyer_from_corporate_email_domain: true
  email_domain_inference_excluded_domains:
  - gmail.com
  - outlook.com
  - hotmail.com
  - yahoo.com
  - orange.fr
  - wanadoo.fr
  amount_only_geometry_recovery: true
  amount_only_derive_unit_price: false
  amount_only_min_material_chars: 5
  amount_only_attach_continuation_rows: true
  amount_only_quote_markers:
  - offre
  - devis
  - quote
  strict_total_label_recovery: true
  strict_total_search_next_rows: 2
  strict_total_prefer_rightmost_value: true
  strict_total_prefer_reconciled_existing: true
  strict_total_require_decimal_token: true
  strict_total_max_abs_value: 1000000000.0
  strict_total_max_reconciliation_ratio: 2.0
  native_table_require_quantity_when_quantity_header_present: true
  native_explicit_table_priority_bonus: 0.18
  native_table_support_qte_cdee: true
  native_table_support_prix_net: true
  native_table_support_montant_ht: true
  native_table_preserve_pack_quantity: true
  native_table_preserve_quote_reference: true
  native_table_require_printed_amount_consistency: true
  native_table_printed_amount_abs_tolerance: 0.03
  native_table_printed_amount_rel_tolerance: 0.005
  po_number_tail_cleanup: true
  po_number_tail_party_quality_threshold: 0.68
  reject_legal_footer_lines: true
  legal_footer_line_terms: [siren, siret, rcs, iban, bic, capital de, capital social, n° intracom, tva intracom, ape, naf]
  legal_footer_min_term_hits: 1
  native_summary_table_totals: true
  strict_text_totals_v48: true
  explicit_role_zone_recovery_v48: true
  role_zone_max_height_ratio: 0.24
  role_zone_stop_terms: [article, designation, reference - designation, mode livraison, condition paiement, total ht, suivant offre, date de livraison]
  ordered_by_block_recovery_v48: true
  party_anchor_address_recovery_v48: true
  party_address_sanitization_v48: true
  role_resolution_v48: true
  party_name_repair_threshold: 0.35
  party_name_promotion_threshold: 0.62

addresses:
  enabled: true
  expose_business_addresses: true
  normalize_components: true
  detect_shared_physical_addresses: true
  preserve_multiple_roles_per_address: true
  min_address_confidence: 0.6
  role_priority:
