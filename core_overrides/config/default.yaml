    provider: IGN_GEOPLATEFORME_BAN
    endpoint: https://data.geopf.fr/geocodage/search
    timeout_seconds: 1.5
    min_score_verified: 0.70
    fail_open: true
semantic_extraction:
  enabled: true
  fuzzy_label_matching: true
  fuzzy_label_threshold: 0.72
  exact_label_bonus: 0.12
  substring_label_bonus: 0.06
  spatial_neighbor_bonus: 0.08
  value_type_bonus: 0.1
  value_type_penalty: 0.14
  use_cross_line_anchors: true
  cross_line_window: 2
  max_value_chars: 500
  keep_unmapped_fields: true
  keep_unmapped_min_confidence: 0.35
  infer_field_types: true
  infer_dates: true
  infer_amounts: true
  infer_quantities: true
  infer_emails: true
  infer_phones: true
  infer_urls: true
  infer_ids: true
normalization:
  decimal_separators:
  - ','
  - .
  thousand_separators:
  - ' '
  - .
  - ','
  - ''''
  default_currency: EUR
  default_country: FR
  default_date_order: DMY
  date_orders:
  - DMY
  - YMD
  - MDY
  normalize_units: true
  normalize_currency: true
  normalize_dates: true
  normalize_whitespace: true
  strip_zero_width_chars: true
  unicode_normalization: NFKC
  uppercase_currency_codes: true
  preserve_raw_values: true
validation:
  enabled: true
  amount_absolute_tolerance: 0.03
  amount_relative_tolerance: 0.005
  quantity_price_check: true
  line_sum_check: true
  tax_check: true
  grand_total_check: true
  grand_total_require_components: true
  date_consistency_check: true
  currency_consistency_check: true
  line_number_sequence_check: true
  negative_quantity_warning: true
  negative_price_warning: true
  duplicate_line_warning: true
  duplicate_key_fields:
  - buyer.name
  - purchase_order.number
  - purchase_order.revision
  critical_failure_on_missing_po_number: true
  critical_failure_on_no_lines: false
  additional_charge_arithmetic_check: true
  include_additional_charges_in_line_sum: true
  printed_total_reconciliation_check: true
  printed_total_min_confidence: 0.8
  semantic_type_guard_check: true
  suspicious_monetary_ratio_check: true
  suspicious_monetary_ratio_max: 20.0
  require_number_when_order_label_present: true
  require_date_when_date_label_present: false
  line_parser_hypothesis_check: true
  line_parser_min_arithmetic_ratio: 0.85
  line_parser_min_structural_score: 0.55
  po_number_type_guard_check: true
  critical_failure_on_invalid_po_number: true
  po_number_contact_collision_check: true
  critical_failure_on_po_contact_collision: true
  party_role_semantic_check: true
  conditional_role_semantic_check: true
  explicit_role_name_min_semantic_quality: 0.45
  legal_footer_line_item_check: true
  party_name_min_semantic_quality: 0.45
  critical_party_roles:
  - buyer
  - supplier
  line_field_completeness_check: true
  line_required_field_min_ratio: 0.8
  printed_total_presence_check: true
confidence:
  weights:
    source: 0.22
    semantic: 0.23
    validation: 0.27
    completeness: 0.13
    consistency: 0.1
    consensus: 0.05
  validation_pass_score: 1.0
  validation_warning_score: 0.72
  validation_fail_score: 0.25
  missing_critical_penalty: 0.18
  low_ocr_quality_penalty: 0.1
  contradictory_evidence_penalty: 0.08
  critical_fields:
