services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jin-model-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./feedback:/app/training/feedback
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: jin-model-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: jin-model-network
