services:
  api:
    image: jin-model-api
    runtime: "${CONTAINER_RUNTIME:-runc}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    container_name: jin-model-api
    restart: unless-stopped
    environment:
      JIN_OFFLINE: "1"
      JIN_FEEDBACK_PATH: /app/training/feedback/learning_feedback.jsonl
      JIN_FEEDBACK_TOKEN: ${JIN_FEEDBACK_TOKEN:-}
      JIN_FEEDBACK_RETRAIN_ON_WRITE: "0"
      JIN_STUDIO_TOKEN: ${JIN_STUDIO_TOKEN:-}
      JIN_STUDIO_SERVICE_TOKEN: ${JIN_STUDIO_SERVICE_TOKEN:-}
      JIN_STUDIO_SERVICE_TOKEN_FILE: /app/data/studio/service-token
      JIN_STUDIO_PASSWORD_MIN_LENGTH: ${JIN_STUDIO_PASSWORD_MIN_LENGTH:-8}
      JIN_STUDIO_SESSION_HOURS: ${JIN_STUDIO_SESSION_HOURS:-12}
      JIN_STUDIO_COOKIE_SECURE: ${JIN_STUDIO_COOKIE_SECURE:-auto}
      JIN_STUDIO_DIR: /app/data/studio
      JIN_STUDIO_SHARED_STORAGE: "1"
      JIN_STUDIO_MIN_TRAINING_DOCUMENTS: ${JIN_STUDIO_MIN_TRAINING_DOCUMENTS:-20}
      JIN_LEARNING_MODEL_DIR: /app/data/learning
      JIN_BAN_INDEX_DIR: /app/data/reference/ban
      JIN_CORPUS_ROUTER_MODEL: /app/data/learning/corpus_text_router.joblib
      JIN_PDF_ROUTER_MODEL: /app/data/learning/jin-pdf-fusion-router-v3-cpu.joblib
      JIN_FIELD_ROUTER_MODEL: /app/data/learning/jin-field-weak-router-v2-cpu.joblib
      JIN_FIELD_ROUTER_THRESHOLD: "0.80"
      JIN_OCR_LANGS: fra+eng+deu
      JIN_ROLE_OVERRIDE_THRESHOLD: "0.93"
      JIN_COMPONENT_FILL_THRESHOLD: "0.88"
      JIN_ALLOW_ROLE_OVERRIDE: "1"
      JIN_FILL_MISSING_COMPONENTS: "1"
    volumes:
      - ./data:/app/data
      - ./feedback:/app/training/feedback
    expose:
      - "8000"
    networks:
      - inference
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp:
    image: jin-model-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    container_name: jin-model-mcp
    restart: unless-stopped
    command: ["python", "-m", "jin_runtime.studio_mcp"]
    environment:
      JIN_STUDIO_DIR: /app/data/studio
      JIN_STUDIO_SHARED_STORAGE: "1"
      JIN_STUDIO_SERVICE_TOKEN: ${JIN_STUDIO_SERVICE_TOKEN:-}
      JIN_STUDIO_TOKEN: ${JIN_STUDIO_TOKEN:-}
      JIN_FEEDBACK_TOKEN: ${JIN_FEEDBACK_TOKEN:-}
      JIN_STUDIO_SERVICE_TOKEN_FILE: /app/data/studio/service-token
      JIN_STUDIO_MCP_TOKEN: ${JIN_STUDIO_MCP_TOKEN:-}
      JIN_STUDIO_MCP_ALLOW_VALIDATION: ${JIN_STUDIO_MCP_ALLOW_VALIDATION:-0}
      JIN_STUDIO_MCP_ALLOWED_HOSTS: ${JIN_STUDIO_MCP_ALLOWED_HOSTS:-mcp,mcp:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*}
      JIN_STUDIO_MCP_ALLOWED_ORIGINS: ${JIN_STUDIO_MCP_ALLOWED_ORIGINS:-}
      JIN_STUDIO_MIN_TRAINING_DOCUMENTS: ${JIN_STUDIO_MIN_TRAINING_DOCUMENTS:-20}
    volumes:
      - ./data:/app/data
    expose:
      - "8001"
    networks:
      - inference
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: Dockerfile.training
      args:
        JIN_BUILD_HTTP_PROXY: "${HTTP_PROXY:-}"
        JIN_BUILD_HTTPS_PROXY: "${HTTPS_PROXY:-}"
        JIN_BUILD_NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
        JIN_TORCH_INDEX_URL: "${JIN_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    container_name: jin-model-trainer
    restart: unless-stopped
    environment:
      JIN_STUDIO_DIR: /app/data/studio
      JIN_STUDIO_SHARED_STORAGE: "1"
      JIN_STUDIO_TRAINING_POLL_SECONDS: ${JIN_STUDIO_TRAINING_POLL_SECONDS:-10}
      JIN_STUDIO_TRAINING_HEARTBEAT_SECONDS: ${JIN_STUDIO_TRAINING_HEARTBEAT_SECONDS:-10}
      JIN_STUDIO_TRAINING_STALE_SECONDS: ${JIN_STUDIO_TRAINING_STALE_SECONDS:-900}
      JIN_STUDIO_TRAINING_STEP_TIMEOUT_SECONDS: ${JIN_STUDIO_TRAINING_STEP_TIMEOUT_SECONDS:-86400}
      HF_HOME: /app/data/huggingface
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./data:/app/data
    networks:
      - default

  web:
    image: nginx:1.27-alpine
    runtime: "${CONTAINER_RUNTIME:-runc}"
    container_name: jin-model-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    ports:
      - "${JIN_WEB_BIND:-127.0.0.1}:${JIN_WEB_PORT:-8080}:80"
    networks:
      - default
      - inference
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  inference:
    internal: true
  default:
    name: jin-model-network
