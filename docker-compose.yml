services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jin-model-api
    restart: unless-stopped
    environment:
      JIN_FEEDBACK_PATH: /app/training/feedback/learning_feedback.jsonl
      JIN_LEARNING_MODEL_DIR: /app/data/learning
      JIN_CORPUS_ROUTER_MODEL: /app/data/learning/corpus_text_router.joblib
      JIN_PDF_ROUTER_MODEL: /app/data/learning/jin-pdf-fusion-router-v2-cpu.joblib
      JIN_ROLE_OVERRIDE_THRESHOLD: "0.93"
      JIN_COMPONENT_FILL_THRESHOLD: "0.88"
      JIN_ALLOW_ROLE_OVERRIDE: "1"
      JIN_FILL_MISSING_COMPONENTS: "1"
    volumes:
      - ./data:/app/data
      - ./feedback:/app/training/feedback
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: jin-model-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: jin-model-network
