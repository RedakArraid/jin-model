name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime-learning:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/support:${{ github.workspace }}/core_overrides:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r runtime-requirements.txt "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q jin_runtime training scripts core_overrides benchmarks
      - name: Validate model tooling
        run: |
          python scripts/install_models.py --help
          python scripts/verify_models.py --help
          python scripts/preflight.py --help
          python scripts/build_ban_index.py --help
      - name: Validate open-weight benchmark registry
        run: python -m benchmarks.open_weight_comparison.runner --list-models
      - name: Run all tracked runtime tests
        run: python -m pytest tests -q
      - name: Run all tracked browser tests
        run: node --test tests/test_*.js
      - name: Validate shell scripts
        run: sh -n prepare-model.sh scripts/materialize-lfs-corpus.sh scripts/install-models.sh scripts/run-standalone.sh scripts/run-open-weight-cpu-benchmark.sh scripts/run-open-weight-smoke.sh scripts/setup-open-weight-benchmark-env.sh scripts/download-qwen-benchmark-models.sh scripts/run-uploaded-jin-qwen-benchmark.sh
      - name: Validate benchmark Makefile targets
        run: |
          make -n benchmark-models
          make -n benchmark-preflight
          make -n benchmark-smoke
          make -n benchmark-qwen2b
          make -n benchmark-qwen4b
          make -n benchmark-embedding
          make -n benchmark-open-weight
